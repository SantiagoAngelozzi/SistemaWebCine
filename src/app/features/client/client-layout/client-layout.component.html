<div class="client-shell">
  <div class="top-strip"></div>

  <header class="navbar">
    <a class="logo" routerLink="inicio">CineQuilmes</a>

    <nav>
      @for (item of navItems; track item.path) {
        <a
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="active"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    @if (logueado()) {
      <div class="sesion">
        <a class="usuario" routerLink="perfil" title="Mi cuenta">{{ nombreUsuario() }}</a>
        <button type="button" class="logout-btn" (click)="cerrarSesion()">Salir</button>
      </div>
    } @else {
      <a class="login-link" routerLink="/auth/login">Ingresar</a>
    }
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
